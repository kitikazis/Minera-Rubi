<svg viewBox="0 0 290 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A01628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD60A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC300;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ICONO: SOL CON RAYOS (compacto y centrado al eje del texto) -->
  <g id="icon" transform="translate(42,60) scale(0.7) translate(-60,-70)">
    <line x1="60" y1="10" x2="60" y2="30" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="85" y1="15" x2="100" y2="30" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="100" y1="40" x2="110" y2="55" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="100" y1="65" x2="110" y2="80" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="85" y1="90" x2="100" y2="105" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="60" y1="95" x2="60" y2="115" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="35" y1="90" x2="20" y2="105" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="20" y1="65" x2="10" y2="80" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="20" y1="40" x2="10" y2="55" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="35" y1="15" x2="20" y2="30" stroke="#EBAF00" stroke-width="3.5" stroke-linecap="round"/>

    <circle cx="60" cy="55" r="25" fill="url(#sunGradient)" />

    <g id="gem">
      <polygon points="40,65 80,65 60,45" fill="#C41E3A"/>
      <polygon points="35,75 85,75 80,105 40,105" fill="#B91A35"/>
      <polygon points="40,105 80,105 60,130" fill="#A01628"/>
      <polygon points="55,75 65,75 60,85" fill="#FF6B7A" opacity="0.6"/>
    </g>
  </g>

  <line x1="92" y1="30" x2="92" y2="90" stroke="#2D2D2D" stroke-width="2"/>

  <text x="108" y="63" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="900" fill="#2D2D2D" letter-spacing="-1">EL RUBÍ</text>
  <text x="108" y="87" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#666666" letter-spacing="1">PLANTA MINERA</text>
</svg>
