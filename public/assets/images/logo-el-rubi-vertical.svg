  <text x="100" y="210" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="900" fill="#2D2D2D" letter-spacing="-1" text-anchor="middle">EL RUBÍ</text>
  <text x="100" y="245" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#666666" letter-spacing="1.5" text-anchor="middle">PLANTA MINERA</text>
