<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gemGradientVertical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A01628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradientVertical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD60A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC300;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g id="icon-vertical" transform="translate(100, 60)">
    <line x1="0" y1="-40" x2="0" y2="-20" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="-28" x2="40" y2="-40" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="0" x2="56" y2="0" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="40" y2="40" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="0" y2="56" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="28" x2="-40" y2="40" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="-56" y2="0" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="-28" x2="-40" y2="-40" stroke="#EBAF00" stroke-width="3" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="20" fill="url(#sunGradientVertical)" />

    <g id="gem-vertical">
      <polygon points="-18,15 18,15 0,-5" fill="#C41E3A"/>
      <polygon points="-20,25 20,25 15,50 -15,50" fill="#B91A35"/>
      <polygon points="-15,50 15,50 0,75" fill="#A01628"/>
      <polygon points="-5,28 5,28 0,38" fill="#FF6B7A" opacity="0.6"/>
